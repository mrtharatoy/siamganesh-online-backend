name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Enforce blueprint HTTP-client boundary
        run: |
          if rg -n '^import requests|^from requests' core/blueprints --glob '*.py'; then
            echo "Blueprints must use a client wrapper instead of requests directly."
            exit 1
          fi

      - name: Run tests
        run: pytest tests/ -v
