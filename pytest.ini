[pytest]
# Restrict test discovery to tests/ only. Without this, a bare `pytest`
# run from the repo root would also recurse into scripts/ and try to
# collect files like scripts/test_gemini.py, scripts/test_github.py,
# etc. as if they were real tests -- they are one-off manual scripts
# that make real network calls at import/module level, not part of
# this project's automated test suite. See scripts/README.md.
testpaths = tests
