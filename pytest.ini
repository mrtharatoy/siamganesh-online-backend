[pytest]
# Restrict test discovery to tests/ only. The one-off manual scripts
# that used to live in scripts/ (real network calls at import time,
# test_*.py naming that a bare `pytest` run would otherwise collect as
# real tests) were archived in SG-H-103 -- see scripts/ARCHIVED.md --
# but this restriction is kept as a guardrail against anything similar
# showing up there again.
testpaths = tests
